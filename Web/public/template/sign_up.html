      content="قالب مدیریت, قالب مدیریت axelit, قالب داشبورد, قالب مدیریت فلت, قالب مدیریت واکنش‌گرا, اپلیکیشن وب"
      name="keywords" />
    <meta content="la-themes" name="author" />
    <link href="../assets/images/logo/favicon.png" rel="icon" type="image/x-icon" />
    <link href="../assets/images/logo/favicon.png" rel="shortcut icon" type="image/x-icon" />

    <title>قالب مدیریتی پریمیوم اکسلیت</title>

    <!--font-awesome-css-->
    <link href="../assets/vendor/fontawesome/css/all.css" rel="stylesheet" />

    <!-- Fonts -->
    <link href="../assets/fonts/estedad/fontface.css" rel="stylesheet" />

    <!-- iconoir icon css  -->
    <link href="../assets/vendor/ionio-icon/css/iconoir.css" rel="stylesheet" />

    <!-- tabler icons-->
    <link href="../assets/vendor/tabler-icons/tabler-icons.css" rel="stylesheet" type="text/css" />

    <!-- Bootstrap css-->
    <link href="../assets/vendor/bootstrap/bootstrap.min.css" rel="stylesheet" type="text/css" />

    <!-- App css-->
    <link href="../assets/css/style.101.css" rel="stylesheet" type="text/css" />

    <!-- Responsive css-->
    <link href="../assets/css/responsive.101.css" rel="stylesheet" type="text/css" />

    <script>
      function isRTL() {
        return document.documentElement.dir === "rtl";
      }
    </script>
  </head>

  <body class="sign-in-bg rtl">
    <div class="app-wrapper d-block">
      <div class="main-container">
        <!-- sign up start -->
        <div class="container">
          <div class="row sign-in-content-bg">
            <div class="col-lg-6 image-contentbox d-none d-lg-block">
              <div class="form-container">
                <div class="signup-content mt-4">
                  <span>
                    <img alt="" class="img-fluid" src="../assets/images/logo/1.png" />
                  </span>
                </div>

                <div class="signup-bg-img">
                  <img alt="" class="img-fluid" src="../assets/images/login/02.png" />
                </div>
              </div>
            </div>
            <div class="col-lg-6 form-contentbox">
              <div class="form-container">
                <form class="app-form rounded-control">
                  <div class="row">
                    <div class="col-12">
                      <div class="mb-5 text-center text-lg-start">
                        <h2 class="text-primary-dark f-w-600">ایجاد حساب</h2>
                        <p>همین امروز رایگان شروع کنید!</p>
                      </div>
                    </div>
                    <div class="col-12">
                      <div class="mb-3">
                        <label class="form-label" for="username">نام کاربری</label>
                        <input
                          class="form-control"
                          id="username"
                          placeholder="نام کاربری خود را وارد کنید"
                          required
                          type="text" />
                      </div>
                    </div>
                    <div class="col-12">
                      <div class="mb-3">
                        <label class="form-label" for="username">ایمیل</label>
                        <input
                          class="form-control"
                          id="email"
                          placeholder="ایمیل خود را وارد کنید"
                          required
                          type="email" />
                      </div>
                    </div>
                    <div class="col-md-6">
                      <div class="mb-3">
                        <label class="form-label" for="password">رمز عبور</label>
                        <input
                          class="form-control"
                          id="password"
                          placeholder="رمز عبور خود را وارد کنید"
                          required
                          type="password" />
                      </div>
                    </div>
                    <div class="col-md-6">
                      <div class="mb-3">
                        <label class="form-label" for="password">تأیید رمز عبور</label>
                        <input
                          class="form-control"
                          id="password1"
                          placeholder="رمز عبور خود را وارد کنید"
                          required
                          type="password" />
                      </div>
                    </div>
                    <div class="col-12">
                      <div class="d-flex justify-content-between gap-3">
                        <div class="form-check mb-3">
                          <input
                            class="form-check-input"
                            id="checkDefault"
                            type="checkbox"
                            value="" />
                          <label class="form-check-label text-secondary" for="checkDefault">
                            شرایط و ضوابط را بپذیرید
                          </label>
                        </div>
                      </div>
                    </div>
                    <div class="col-12">
                      <div class="mb-3">
                        <a class="btn btn-light-primary w-100" href="index.html" role="button">
                          ثبت نام
                        </a>
                      </div>
                    </div>
                    <div class="col-12">
                      <div class="text-center text-lg-start">
                        از قبل یک حساب دارید؟
                        <a
                          class="link-primary-dark text-decoration-underline"
                          href="sign_in.html">
                          ورود
                        </a>
                      </div>
                    </div>
                    <div class="app-divider-v justify-content-center">
                      <p>یا ثبت نام با</p>
                    </div>
                    <div class="col-12">
                      <div class="text-center">
                        <button class="btn btn-light-facebook icon-btn b-r-22 m-1" type="button">
                          <i class="ti ti-brand-facebook"></i>
                        </button>
                        <button class="btn btn-light-gmail icon-btn b-r-22 m-1" type="button">
                          <i class="ti ti-brand-google"></i>
                        </button>
                        <button class="btn btn-light-github icon-btn b-r-22 m-1" type="button">
                          <i class="ti ti-brand-github"></i>
                        </button>
                      </div>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
        <!-- sign up end -->
      </div>
    </div>

    <!-- latest jquery-->
    <script src="../assets/js/jquery-3.6.3.min.js"></script>

    <!-- Bootstrap js-->
    <script src="../assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  </body>
</html>
