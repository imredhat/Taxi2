<script>
        // Simple input focus effects
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.previousElementSibling?.classList.add('text-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.previousElementSibling?.classList.remove('text-primary');
            });
        });

        // Atmospheric parallax on mouse move (desktop) or orientation (mobile)
        if (window.innerWidth > 768) {
            document.addEventListener('mousemove', (e) => {
                const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
                const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
                document.querySelector('[data-alt*="highway"]').style.transform = `scale(1.1) translate(${moveX}px, ${moveY}px)`;
            });
        }
    </script>
