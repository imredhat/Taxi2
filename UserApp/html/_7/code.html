<!-- Overlay for Drawer -->
<div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[55] hidden transition-opacity duration-300" id="overlay" onclick="toggleDrawer()"></div>
<script>
        function toggleDrawer() {
            const drawer = document.getElementById('drawer');
            const overlay = document.getElementById('overlay');
            const isOpen = drawer.classList.contains('translate-x-0');
            
            if (isOpen) {
                drawer.classList.replace('translate-x-0', 'translate-x-full');
                overlay.classList.replace('block', 'hidden');
                overlay.classList.add('opacity-0');
            } else {
                drawer.classList.replace('translate-x-full', 'translate-x-0');
                overlay.classList.replace('hidden', 'block');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
            }
        }

        // Lightweight atmospheric parallax
        window.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 10;
            const y = (e.clientY / window.innerHeight - 0.5) * 10;
            document.querySelector('.bg-cover').style.transform = `scale(1.05) translate(${x}px, ${y}px)`;
        });
    </script>
